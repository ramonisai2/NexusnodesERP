# NexusERP local stack
# Requires Docker. Services (gateway/inventory/payroll) can also run via `go run` against these deps.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opa:
    image: openpolicyagent/opa:0.70.0
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - /policies
    ports:
      - "8181:8181"
    volumes:
      - ./infra/opa/policies:/policies:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./infra/keycloak/realm-nexus.json:/opt/keycloak/data/import/realm-nexus.json:ro

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  # Observability profile: docker compose --profile obs up -d
  tempo:
    profiles: ["obs"]
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"   # Tempo query API / UI backend
      - "4317:4317"   # OTLP gRPC (direct; prefer collector)
      - "4318:4318"   # OTLP HTTP (apps point here when collector is down)
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  otel-collector:
    profiles: ["obs"]
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4319:4318"   # host apps → collector HTTP (avoids clash with Tempo :4318)
      - "4320:4317"
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - tempo

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    ports:
      - "3000:3000"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - tempo

  # -------------------------------------------------------------------------
  # Application profile: docker compose --profile app up -d --build
  # Bundles Go services + SPA. Requires only Docker (no local Go/Node).
  # -------------------------------------------------------------------------
  inventory:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/inventory/Dockerfile
    environment:
      DATABASE_URL: postgres://nexus:nexus@postgres:5432/nexus_erp?sslmode=disable
      OPA_URL: http://opa:8181
      DEV_AUTH_BYPASS: "true"
      OTEL_EXPORTER: none
      INVENTORY_ADDR: ":8082"
      PUBLIC_WEB_BASE: ${PUBLIC_WEB_BASE:-http://localhost:8088}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started

  payroll:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/payroll/Dockerfile
    environment:
      DATABASE_URL: postgres://nexus:nexus@postgres:5432/nexus_erp?sslmode=disable
      OPA_URL: http://opa:8181
      DEV_AUTH_BYPASS: "true"
      OTEL_EXPORTER: none
      PAYROLL_ADDR: ":8083"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started

  gateway:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      DATABASE_URL: postgres://nexus:nexus@postgres:5432/nexus_erp?sslmode=disable
      OPA_URL: http://opa:8181
      DEV_AUTH_BYPASS: "true"
      DEV_JWT_SECRET: ${DEV_JWT_SECRET:-nexus-dev-secret-change-me}
      OTEL_EXPORTER: none
      GATEWAY_ADDR: ":8080"
      INVENTORY_URL: http://inventory:8082
      PAYROLL_URL: http://payroll:8083
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8088}
      PUBLIC_WEB_BASE: ${PUBLIC_WEB_BASE:-http://localhost:8088}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
      inventory:
        condition: service_started
      payroll:
        condition: service_started

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - gateway

volumes:
  pgdata:
  tempo-data:
  grafana-data:
