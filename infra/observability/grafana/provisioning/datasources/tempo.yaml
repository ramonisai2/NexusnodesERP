apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    uid: tempo
    url: http://tempo:3200
    isDefault: true
    editable: false
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        customQuery: false
      serviceMap:
        datasourceUid: tempo
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: tempo
      streamingEnabled:
        search: true
      spanBar:
        type: Tag
        tag: http.method
